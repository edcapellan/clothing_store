<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Noemi Closet LLC{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='../static/css/syle.css') }}"
    />
    {% block extra_head %}{% endblock %}
  </head>
  <body class="{% block body_class %}{% endblock %}">
    <header class="site-header">
      <div class="header-inner">
        <a href="{{ url_for('home') }}" class="logo">Noemi Closet LLC</a>

        <nav class="main-nav">
          <a
            href="{{ url_for('nails') }}"
            class="{{ 'active' if active_page == 'nails' else '' }}"
            >Nails</a
          >
          <a
            href="{{ url_for('accessories') }}"
            class="{{ 'active' if active_page == 'accessories' else '' }}"
            >Accessories</a
          >
          <a
            href="{{ url_for('clothing') }}"
            class="{{ 'active' if active_page == 'clothing' else '' }}"
            >Clothing</a
          >
          <a
            href="{{ url_for('jewelry') }}"
            class="{{ 'active' if active_page == 'jewelry' else '' }}"
            >Jewelry</a
          >
        </nav>

        <a
          href="{{ url_for('cart') }}"
          class="cart-icon"
          aria-label="View cart, {{ cart_count }} item{% if cart_count != 1 %}s{% endif %}"
        >
          <i class="fa-solid fa-bag-shopping" aria-hidden="true"></i>
          <span
            class="cart-count"
            aria-live="polite"
            data-count="{{ cart_count }}"
            >{{ cart_count }}</span
          >
        </a>
      </div>
    </header>

    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
