<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Noemi Closet LLC{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='../static/css/syle.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

  <header class="site-header">
    <div class="header-inner">
      <a href="{{ url_for('home') }}" class="logo">Noemi Closet LLC</a>

      <nav class="main-nav">
        <a href="{{ url_for('nails') }}" class="{{ 'active' if active_page == 'nails' else '' }}">Nails</a>
        <a href="{{ url_for('accessories') }}" class="{{ 'active' if active_page == 'accessories' else '' }}">Accessories</a>
        <a href="{{ url_for('clothing') }}" class="{{ 'active' if active_page == 'clothing' else '' }}">Clothing</a>
        <a href="{{ url_for('jewelry') }}" class="{{ 'active' if active_page == 'jewelry' else '' }}">Jewelry</a>
      </nav>

      <a href="{{ url_for('cart') }}" class="cart-icon" aria-label="View cart">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 8V6a6 6 0 0 1 12 0v2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4.5 8h15l-1 12.5a1.5 1.5 0 0 1-1.5 1.5H7a1.5 1.5 0 0 1-1.5-1.5L4.5 8Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

</body>
</html>
